version: 2

sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
      - name: orders


models:
  - name: stage_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
  - name: stage_orders
    columns: 
      - name: order_id
        tests:
          - unique 
      - name: order_status
        tests:
          - accepted_values:
              values: ['shipped','returned','completed','return_pending']
        
  
      

